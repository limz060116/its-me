<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mingze Li</title><style>
:root{--paper:#f7f5ef;--green:#344d43;--ink:#303630;--line:#d5d8ce}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:110px}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 Arial,"PingFang SC","Microsoft YaHei",sans-serif}header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2} .bar{max-width:1000px;margin:auto;padding:16px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.name{font:22px Georgia,serif;margin-right:auto}nav{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;font-size:13px;color:var(--green);background:none;border:1px solid var(--line);padding:3px 10px;cursor:pointer}main{max-width:900px;margin:auto;padding:0 24px}section{padding:48px 0;border-bottom:1px solid var(--line);min-height:220px}h1,h2{font-family:Georgia,"Songti SC",SimSun,serif;font-weight:400;color:var(--green);line-height:1.4;margin:0 0 24px}h1{font-size:36px}h2{font-size:27px}.home{min-height:300px}.timeline{border-left:1px solid var(--green);margin:24px 0 0 8px;padding:0 0 0 24px;min-height:100px}.entry{position:relative;padding:0 0 26px}.entry:before{content:'';position:absolute;left:-29px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--green)}.entry time{font-size:13px;color:var(--green)}.entry h3{margin:4px 0;font-size:17px;font-weight:500}.entry p{margin:4px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.gallery img{width:100%;height:auto}figure{margin:0}footer{max-width:900px;margin:auto;padding:24px;color:var(--green);font-size:13px} [data-lang="zh"]{display:none}html[lang="zh"] [data-lang="en"]{display:none}html[lang="zh"] [data-lang="zh"]{display:revert}@media(max-width:650px){.bar{gap:10px;padding:12px 18px}nav{order:3;width:100%;gap:8px 15px}section{padding:34px 0}h1{font-size:30px}html{scroll-padding-top:160px}}
</style></head><body><header><div class="bar"><a class="name" href="#home">Mingze Li</a><nav aria-label="Navigation"><a href="#home"><span data-lang="en">Home</span><span data-lang="zh">首页</span></a><a href="#journey"><span data-lang="en">My Journey</span><span data-lang="zh">我的成长经历</span></a><a href="#academic"><span data-lang="en">Academic Interests</span><span data-lang="zh">我的学术兴趣</span></a><a href="#photography"><span data-lang="en">Photography</span><span data-lang="zh">我的摄影作品</span></a><a href="#reflections"><span data-lang="en">Reflections</span><span data-lang="zh">我的思考</span></a></nav><button id="language" type="button">中文</button></div></header><main>

-->
</div></section>

</main><footer>© Mingze Li</footer><script>const button=document.getElementById('language');function setLanguage(lang){document.documentElement.lang=lang;button.textContent=lang==='zh'?'English':'中文';try{localStorage.setItem('its-me-language',lang)}catch(e){}}let lang='en';try{if(localStorage.getItem('its-me-language')==='zh')lang='zh'}catch(e){}setLanguage(lang);button.addEventListener('click',()=>setLanguage(document.documentElement.lang==='en'?'zh':'en'));</script></body></html>
